services:
  grsshopper:
    build: .
    restart: unless-stopped
    networks:
      - web
      - db
    volumes:
      - ./site:/usr/local/apache2/htdocs
      - /srv/www:/srv/www:rw
    command: ["/bin/sh", "-lc", "cron && exec /usr/local/apache2/bin/httpd -DFOREGROUND"]

networks:
  web:
    external: true
  db:
    external: true
